<div class="forgot-password-container">
  <div class="forgot-password-card">
    <!-- Logo -->
    <div class="logo-section">
      <img src="assets/logo.svg" alt="Company Logo" class="logo" />
      <h1 class="form-title">Reset Password</h1>
      <p class="form-subtitle" *ngIf="!emailSent">
        Enter your email address and we'll send you instructions to reset your password
      </p>
    </div>

    <!-- Email Not Sent -->
    <form *ngIf="!emailSent" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="forgot-password-form">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-wrapper">
          <input
            id="email"
            type="email"
            formControlName="email"
            class="form-control"
            [class.error]="hasError('email', 'required') || hasError('email', 'email')"
            placeholder="you@company.com"
            autocomplete="email"
          />
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </span>
        </div>
        <div class="error-message" *ngIf="hasError('email', 'required')">
          Email is required
        </div>
        <div class="error-message" *ngIf="hasError('email', 'email')">
          Please enter a valid email address
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="forgotPasswordForm.invalid"
      >
        Send Reset Instructions
      </button>

      <div class="back-link">
        <button
          type="button"
          class="link-button"
          (click)="navigateToLogin()"
        >
          ← Back to Sign In
        </button>
      </div>
    </form>

    <!-- Email Sent -->
    <div *ngIf="emailSent" class="success-message">
      <div class="success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <h2 class="success-title">Check your email</h2>
      <p class="success-description">
        We've sent password reset instructions to your email address.
        Please check your inbox and follow the link to reset your password.
      </p>
      <div class="success-actions">
        <button
          type="button"
          class="btn btn-primary"
          (click)="navigateToLogin()"
        >
          Back to Sign In
        </button>
        <button
          type="button"
          class="link-button"
          (click)="resendEmail()"
        >
          Resend email
        </button>
      </div>
    </div>
  </div>
</div>
