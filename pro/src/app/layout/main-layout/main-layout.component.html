<div class="flex h-screen w-full bg-slate-50 dark:bg-slate-900 overflow-hidden">
  
  <aside class="hidden md:flex flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 transition-all duration-300 ease-in-out z-30 relative"
         [ngClass]="{'w-20': isSidebarCollapsed, 'w-64': !isSidebarCollapsed}">
    <app-sidebar [isCollapsed]="isSidebarCollapsed" [isMobile]="false"></app-sidebar>
  </aside>

  <div class="md:hidden">
    <div *ngIf="isMobileMenuOpen" 
         (click)="toggleMobileMenu()" 
         class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 transition-opacity duration-300">
    </div>
    
    <div class="fixed inset-y-0 left-0 z-50 w-72 bg-white dark:bg-slate-900 shadow-2xl transform transition-transform duration-300 ease-out"
         [ngClass]="{'translate-x-0': isMobileMenuOpen, '-translate-x-full': !isMobileMenuOpen}">
         <app-sidebar [isMobile]="true" (closeMenu)="toggleMobileMenu()"></app-sidebar>
    </div>
  </div>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
    
    <app-header 
      (toggleSidebar)="toggleSidebar()" 
      (toggleMobileMenu)="toggleMobileMenu()"
      class="z-20">
    </app-header>

    <main class="flex-1 overflow-y-auto overflow-x-hidden p-4 md:p-8 scroll-smooth">
      <div class="max-w-7xl mx-auto w-full">
         <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
