<header class="sticky top-0 z-20 h-16 flex items-center justify-between px-4 md:px-8 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md supports-[backdrop-filter]:bg-white/60">
  
  <div class="flex items-center gap-4 flex-1">
    <button (click)="onToggleMobileMenu()" 
            class="p-2 -ml-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 md:hidden transition-colors">
      <i class="fa-solid fa-bars text-xl"></i>
    </button>

    <button (click)="onToggleSidebar()" 
            class="hidden md:flex p-2 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
      <i class="fa-solid fa-bars-staggered text-lg"></i>
    </button>

    <div class="hidden md:flex items-center max-w-md w-full ml-2">
      <div class="relative w-full group">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 group-focus-within:text-blue-500 transition-colors">
          <i class="fa-solid fa-search"></i>
        </span>
        <input type="text" 
               placeholder="Search employees, projects..." 
               class="w-full py-2 pl-10 pr-12 bg-slate-100 dark:bg-slate-800 border-transparent text-slate-600 dark:text-slate-300 placeholder-slate-400 text-sm rounded-lg focus:outline-none focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all shadow-sm">
        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
          <span class="text-xs text-slate-400 border border-slate-300 dark:border-slate-600 rounded px-1.5 py-0.5">⌘K</span>
        </div>
      </div>
    </div>
  </div>

  <div class="flex items-center gap-3 md:gap-4">
    
    <button class="relative p-2 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors focus:outline-none">
      <i class="fa-regular fa-bell text-xl"></i>
      <span class="absolute top-2 right-2 h-2 w-2 bg-red-500 rounded-full ring-2 ring-white dark:ring-slate-900"></span>
    </button>

    <div class="h-8 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>

    <div class="relative">
      <button (click)="toggleProfileDropdown()" 
              class="flex items-center gap-3 p-1 rounded-full hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors focus:outline-none group">
        <div class="h-9 w-9 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 text-white flex items-center justify-center text-sm font-bold shadow-md ring-2 ring-white dark:ring-slate-900 group-hover:ring-blue-100 transition-all">
          {{ (currentUser$ | async)?.firstName?.charAt(0) || 'U' }}
        </div>
        
        <div class="hidden md:block text-left mr-1">
          <div class="text-sm font-semibold text-slate-700 dark:text-slate-200 leading-tight">
            {{ (currentUser$ | async)?.firstName }}
          </div>
          <div class="text-xs text-slate-500 font-medium">
            {{ (currentUser$ | async)?.role || 'Team Member' }}
          </div>
        </div>
        
        <i class="fa-solid fa-chevron-down text-xs text-slate-400 group-hover:text-slate-600 transition-colors"></i>
      </button>

      <div *ngIf="isProfileDropdownOpen" 
           class="absolute right-0 mt-3 w-56 bg-white dark:bg-slate-800 rounded-xl shadow-xl ring-1 ring-black ring-opacity-5 py-2 transform origin-top-right transition-all animate-fadeIn z-50">
        
        <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-700 mb-1 md:hidden">
          <p class="text-sm font-medium text-slate-900 dark:text-white">{{ (currentUser$ | async)?.firstName }}</p>
          <p class="text-xs text-slate-500 truncate">{{ (currentUser$ | async)?.email }}</p>
        </div>

        <a routerLink="/profile" class="flex items-center px-4 py-2.5 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
          <i class="fa-regular fa-user mr-3 w-4 text-slate-400"></i> My Profile
        </a>
        <a routerLink="/settings" class="flex items-center px-4 py-2.5 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
          <i class="fa-solid fa-cog mr-3 w-4 text-slate-400"></i> Settings
        </a>
        
        <div class="border-t border-slate-100 dark:border-slate-700 my-1"></div>
        
        <button (click)="logout()" class="flex w-full items-center px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
          <i class="fa-solid fa-arrow-right-from-bracket mr-3 w-4"></i> Sign Out
        </button>
      </div>
      
      <div *ngIf="isProfileDropdownOpen" (click)="isProfileDropdownOpen = false" class="fixed inset-0 z-40"></div>
    </div>
  </div>
</header>
