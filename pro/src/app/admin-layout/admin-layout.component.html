<div class="h-screen flex bg-gradient-to-br from-slate-50 to-slate-100" 
     [ngClass]="isDarkMode ? 'dark bg-gradient-to-br from-slate-900 to-slate-800' : ''">
    <!-- Sidebar -->
    <aside class="fixed inset-y-0 flex flex-col w-72 transition-all duration-300 ease-out shadow-xl"
           [ngClass]="{'translate-x-0': isSidebarOpen, '-translate-x-full lg:translate-x-0': !isSidebarOpen,
                       'bg-slate-800': isDarkMode, 'bg-white': !isDarkMode}">
      <!-- Logo Section -->
      <div class="flex items-center h-20 px-8 border-b" 
           [ngClass]="isDarkMode ? 'border-slate-700' : 'border-slate-200'">
        <img src="assets/logo.png" alt="Logo" class="h-10 w-auto">
        <span class="ml-3 text-xl font-bold tracking-tight" 
              [ngClass]="isDarkMode ? 'text-white' : 'text-slate-800'">
          EMS Portal
        </span>
      </div>
  
      <!-- Navigation -->
      <nav class="flex-1 overflow-y-auto py-6 px-4">
        <div class="space-y-2">
          <a *ngFor="let item of navigationItems"
             [routerLink]="item.route"
             routerLinkActive="bg-gradient-to-r from-blue-600 to-indigo-700 text-white shadow-lg"
             class="flex items-center px-5 py-3.5 rounded-xl text-sm font-medium transition-all duration-200 group"
             [ngClass]="!isActiveRoute(item.route) ? 
                        (isDarkMode ? 'text-slate-300 hover:bg-slate-700/50' : 'text-slate-600 hover:bg-slate-100')
                        : ''">
            <i class="fas fa-{{ item.icon }} w-5 transition-transform duration-200 group-hover:scale-110"></i>
            <span class="ml-3">{{ item.label }}</span>
          </a>
        </div>
      </nav>
  
      <!-- User Profile Section -->
      <div class="p-6 border-t" [ngClass]="isDarkMode ? 'border-slate-700' : 'border-slate-200'">
        <div class="flex items-center p-3 rounded-xl transition-colors duration-200 cursor-pointer"
             [ngClass]="isDarkMode ? 'hover:bg-slate-700/50' : 'hover:bg-slate-100'">
          <img src="assets/avatars/user.png" 
               alt="User" 
               class="h-11 w-11 rounded-lg object-cover ring-2 transition-all duration-200"
               [ngClass]="isDarkMode ? 'ring-blue-500/30' : 'ring-blue-500/20'">
          <div class="ml-3">
            <p class="text-sm font-semibold" [ngClass]="isDarkMode ? 'text-white' : 'text-slate-800'">John Doe</p>
            <p class="text-xs" [ngClass]="isDarkMode ? 'text-slate-400' : 'text-slate-500'">Administrator</p>
          </div>
        </div>
      </div>
    </aside>
  
    <!-- Main Content -->
    <div class="flex-1 flex flex-col lg:pl-72">
      <!-- Top Navigation -->
      <header class="h-20 flex items-center justify-between px-6 sm:px-8 shadow-sm backdrop-blur-sm"
              [ngClass]="isDarkMode ? 'bg-slate-800/80' : 'bg-white/80'">
        <button 
          (click)="toggleSidebar()"
          class="lg:hidden p-2.5 rounded-xl transition-all duration-200"
          [ngClass]="isDarkMode ? 'text-slate-200 hover:bg-slate-700' : 'text-slate-600 hover:bg-slate-100'">
          <i class="fas text-lg" [ngClass]="isSidebarOpen ? 'fa-times' : 'fa-bars'"></i>
        </button>
  
        <!-- Search Bar -->
        <div class="flex-1 max-w-xl ml-6 hidden md:block">
          <div class="relative">
            <input type="text" 
                   placeholder="Search anything..."
                   class="w-full pl-11 pr-4 py-2.5 rounded-xl text-sm transition-all duration-200"
                   [ngClass]="isDarkMode ? 
                             'bg-slate-700/50 border-slate-600 text-white placeholder-slate-400 focus:bg-slate-700' : 
                             'bg-slate-100 border-transparent text-slate-900 placeholder-slate-400 focus:bg-slate-50'">
            <i class="fas fa-search absolute left-4 top-3" 
               [ngClass]="isDarkMode ? 'text-slate-400' : 'text-slate-500'"></i>
          </div>
        </div>
  
        <!-- Right Actions -->
        <div class="flex items-center gap-4">
          <!-- Notifications -->
          <button class="p-2.5 rounded-xl relative transition-all duration-200"
                  [ngClass]="isDarkMode ? 'hover:bg-slate-700' : 'hover:bg-slate-100'">
            <i class="fas fa-bell text-lg" [ngClass]="isDarkMode ? 'text-slate-300' : 'text-slate-600'"></i>
            <span class="absolute top-2 right-2 h-2.5 w-2.5 bg-rose-500 rounded-full ring-2"
                  [ngClass]="isDarkMode ? 'ring-slate-800' : 'ring-white'"></span>
          </button>
  
          <!-- Theme Toggle -->
          <button (click)="toggleDarkMode()"
                  class="p-2.5 rounded-xl transition-all duration-200"
                  [ngClass]="isDarkMode ? 'hover:bg-slate-700' : 'hover:bg-slate-100'">
            <i class="fas text-lg" 
               [ngClass]="isDarkMode ? 'fa-sun text-amber-400' : 'fa-moon text-slate-600'"></i>
          </button>
        </div>
      </header>
  
      <!-- Main Content Area -->
      <main class="flex-1 overflow-y-auto bg-transparent">
        
  
        <!-- Router Outlet Container -->
        <div class="px-8 py-3 pb-8">
          <router-outlet></router-outlet>
        </div>
      </main>
  
      <!-- Footer -->
      <footer class="py-6 px-8 border-t backdrop-blur-sm"
              [ngClass]="isDarkMode ? 'bg-slate-800/80 border-slate-700 text-slate-400' : 'bg-white/80 border-slate-200 text-slate-600'">
        <div class="flex flex-col md:flex-row justify-between items-center gap-3 text-sm">
          <p>&copy; 2025 EMS Portal. All rights reserved.</p>
          <div class="flex gap-8">
            <a href="#" class="transition-colors duration-200 hover:text-blue-500">Privacy Policy</a>
            <a href="#" class="transition-colors duration-200 hover:text-blue-500">Terms of Service</a>
            <a href="#" class="transition-colors duration-200 hover:text-blue-500">Support</a>
          </div>
        </div>
      </footer>
    </div>
</div>
